
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      DATABASE_CONNECTION_STRING_FILE: /run/secrets/sql_connection_string
    volumes:
      - ${DATABASE_CONNECTION_STRING_FILE:-./config/sql_connection_string}:/run/secrets/sql_connection_string:ro
    expose:
      - "3050"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_API_TOKEN: ${VITE_API_TOKEN:?Set VITE_API_TOKEN in .env.prod}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ORIGIN_CERT_FILE:-./certs/OriginCert.pem}:/etc/nginx/certs/OriginCert.pem:ro
      - ${PRIVATE_KEY_FILE:-./certs/OriginCert.key}:/etc/nginx/certs/OriginCert.key:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped